document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Reels.<\u002Fspan>\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Gestão.<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"{{ waSocial }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;padding:15px 28px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);color:var(--bow-white);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:background .25s,color .25s\" style-hover=\"background:var(--bow-white);color:var(--bow-black)\">Conhecer Social Media<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-fade=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(24px,4vw,72px);padding:clamp(34px,4.4vw,72px) 0;border-top:1px solid var(--border-subtle)\">\n        <div>\n          <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,6vw,5.4rem);line-height:.85;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px var(--bow-green)\">02<\u002Fspan>\n          <h2 style=\"margin:18px 0 0;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase\">Identidade Visual<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"min-width:0\">\n          <p style=\"margin:0 0 20px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.6rem);line-height:1.05;letter-spacing:-.03em;text-transform:uppercase\">Marcas que têm presença antes mesmo de falar.<\u002Fp>\n          <p style=\"margin:0 0 26px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:56ch\">Criamos identidades visuais que traduzem posicionamento, personalidade e valor em cada ponto de contato.<\u002Fp>\n          <div style=\"display:flex;flex-wrap 0 0 26px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:56ch\">Conectamos diferentes canais, ideias e ações para construir presença, gerar demanda e aproximar sua marca das pessoas certas.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px\">\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Estratégia.<\u002Fspan>\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Campanhas.<\u002Fspan>\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Tráfego.<\u002Fspan>\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Conteúdo.<\u002Fspan>\n            <span style=\"padding:7px 15px;border-radius:var(--radius-pill);background:var(--bow-green-tint);color:var(--bow-green-light);font-size:12px;font-weight:600\">Performance.<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"{{ waMarketing }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;padding:15px 28px;border-radius:var(--radius-pill);border:1px solid var(--border-strong);color:var(--bow-white);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:background .25s,color .25s\" style-hover=\"background:var(--bow-white);color:var(--bow-black)\">Conhecer Marketing<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(80px,10vw,160px) clamp(16px,5vw,64px);background:var(--bow-black-soft);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div style=\"margin-bottom:clamp(40px,5vw,72px);max-width:26ch\">\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:18px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">04 — Nosso método<\u002Fspan>\n        <h2 data-split=\"1\" style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5vw,4.4rem);line-height:.98;letter-spacing:-.035em;text-transform:uppercase\">Como a Bow transforma ideias em projetos.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:clamp(14px,1.6vw,22px)\">\n        <div data-stack=\"1\" style=\"position:sticky;top:80px;padding:clamp(26px,3.4vw,50px);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bow-black);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(18px,3vw,56px)\">\n          <div><span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,4.4vw,4rem);line-height:.9;letter-spacing:-.04em;color:var(--bow-green)\">01<\u002Fspan><h3 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.02em;text-transform:uppercase\">Entender<\u002Fh3><\u002Fdiv>\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">Primeiro, entendemos. Conhecemos sua empresa, seu mercado, seu público, seus desafios e seus objetivos. Porque uma boa solução começa fazendo as perguntas certas.<\u002Fp>\n        <\u002Fdiv>\n        <div data-stack=\"1\" style=\"position:sticky;top:100px;padding:clamp(26px,3.4vw,50px);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bow-black);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(18px,3vw,56px)\">\n          <div><span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,4.4vw,4rem);line-height:.9;letter-spacing:-.04em;color:var(--bow-green)\">02<\u002Fspan><h3 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.02em;text-transform:uppercase\">Estrategizar<\u002Fh3><\u002Fdiv>\n          <div><p style=\"margin:0 0 14px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">Depois, encontramos a direção. Definimos posicionamento, linguagem, prioridades e caminhos para transformar objetivos em ações.<\u002Fp><p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-body-lg)\">Menos achismo.<br>Mais intenção.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-stack=\"1\" style=\"position:sticky;top:120px;padding:clamp(26px,3.4vw,50px);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bow-black);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(18px,3vw,56px)\">\n          <div><span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,4.4vw,4rem);line-height:.9;letter-spacing:-.04em;color:var(--bow-green)\">03<\u002Fspan><h3 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.02em;text-transform:uppercase\">Criar<\u002Fh3><\u002Fdiv>\n          <div><p style=\"margin:0 0 14px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">É hora de transformar estratégia em algo que pode ser visto, usado e lembrado.<\u002Fp><p style=\"margin:0 0 14px;font-size:var(--text-body);line-height:1.9;color:var(--bow-gray-100)\">Marcas. Conteúdos. Sites. Campanhas. Produtos digitais.<\u002Fp><p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-body-lg);color:var(--bow-green)\">Criatividade com propósito.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-stack=\"1\" style=\"position:sticky;top:140px;padding:clamp(26px,3.4vw,50px);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bow-black);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(18px,3vw,56px)\">\n          <div><span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,4.4vw,4rem);line-height:.9;letter-spacing:-.04em;color:var(--bow-green)\">04<\u002Fspan><h3 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.02em;text-transform:uppercase\">Colocar no ar<\u002Fh3><\u002Fdiv>\n          <div><p style=\"margin:0 0 14px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">Ideia parada não gera impacto. Por isso, colocamos tudo para funcionar.<\u002Fp><p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--bow-gray-100)\">Conteúdo publicado. Site no ar. Campanha rodando. Produto funcionando.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-stack=\"1\" style=\"position:sticky;top:160px;padding:clamp(26px,3.4vw,50px);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);background:var(--bow-black-elevated);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(18px,3vw,56px)\">\n          <div><span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,4.4vw,4rem);line-height:.9;letter-spacing:-.04em;color:var(--bow-green)\">05<\u002Fspan><h3 style=\"margin:14px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,2vw,1.7rem);letter-spacing:-.02em;text-transform:uppercase\">Evoluir<\u002Fh3><\u002Fdiv>\n          <div><p style=\"margin:0 0 14px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">O projeto não termina quando vai para o ar. Analisamos, aprendemos e ajustamos.<\u002Fp><p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--bow-gray-100)\">Porque marcas crescem. Mercados mudam. E o digital nunca fica parado.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"position:relative;padding:clamp(90px,12vw,180px) clamp(16px,5vw,64px);border-top:1px solid var(--border-subtle);overflow:hidden\">\n    <div data-parallax=\"1\" style=\"position:absolute;inset:-14% 0;z-index:0;opacity:.4\"><image-slot id=\"bow-saas-bg\" shape=\"rect\" placeholder=\"Imagem de apoio — produto / interface\"><\u002Fimage-slot><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,10,10,.9),rgba(10,10,10,.98))\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:clamp(32px,5vw,90px)\">\n      <div>\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:18px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">07 — SaaS &amp; Tecnologia<\u002Fspan>\n        <h2 data-split=\"1\" style=\"margin:0 0 24px;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5vw,4.2rem);line-height:.96;letter-spacing:-.035em;text-transform:uppercase\">Não criamos apenas para a internet. <span style=\"background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent\">Criamos para dentro dela também.<\u002Fspan><\u002Fh2>\n        <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:50ch\">Quando uma ideia precisa virar produto, sistema ou operação, a Bow entra no desenvolvimento.<\u002Fp>\n      <\u002Fdiv>\n      <div data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:26px\">\n        <p style=\"margin:0;font-size:var(--text-body);color:var(--bow-gray-100)\">Criamos soluções digitais para empresas que querem:<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:1px;background:var(--border-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden\">\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Automatizar processos.<\u002Fspan>\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Organizar operações.<\u002Fspan>\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Centralizar informações.<\u002Fspan>\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Simplificar tarefas.<\u002Fspan>\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Criar novos produtos.<\u002Fspan>\n          <span style=\"background:var(--bow-black-soft);padding:20px;font-size:var(--text-body-sm);font-weight:500\">Ganhar eficiência.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-h3);line-height:1.6\">Do conceito à interface.<br>Da interface ao produto.<br>Da ideia ao funcionamento.<\u002Fp>\n        <a href=\"{{ waTech }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:inline-flex;padding:18px 34px;border-radius:var(--radius-pill);background:var(--accent-gradient);color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:filter .18s,transform .18s\" style-hover=\"filter:brightness(1.12)\" style-active=\"transform:scale(.97)\">Criar uma solução<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ======================= CASES ======================= -->\n<sc-if value=\"{{ isCases }}\" hint-placeholder-val=\"{{ false }}\">\n<main>\n\n  <section style=\"padding:clamp(90px,14vh,170px) clamp(16px,5vw,64px) clamp(44px,5vw,72px)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <span data-fade=\"1\" style=\"display:block;margin-bottom:20px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">08 — Projetos<\u002Fspan>\n      <h1 data-split=\"1\" style=\"margin:0 0 28px;font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,7vw,6.4rem);line-height:.93;letter-spacing:-.04em;text-transform:uppercase;max-width:18ch\">O que a gente faz na prática.<\u002Fh1>\n      <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:56ch\">Projetos que nasceram de desafios reais e ganharam forma através de estratégia, criatividade e tecnologia.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:0 clamp(16px,5vw,64px) clamp(70px,9vw,130px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(24px,3vw,56px)\">\n      <article data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div data-parallax-soft=\"1\" style=\"position:relative;aspect-ratio:16/11;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)\">\n          <image-slot id=\"bow-p1\" shape=\"rect\" placeholder=\"Attualize Esquadrias — imagem do projeto\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--bow-green)\">Projeto 01<\u002Fspan>\n          <h2 style=\"margin:14px 0 12px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,2.8vw,2.4rem);letter-spacing:-.03em;text-transform:uppercase\">Attualize Esquadrias<\u002Fh2>\n          <p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--text-secondary)\">Posicionamento.<br>Social Media.<br>Conteúdo.<br>Direção criativa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div data-parallax-soft=\"1\" style=\"position:relative;aspect-ratio:16/11;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)\">\n          <image-slot id=\"bow-p2\" shape=\"rect\" placeholder=\"IOA Blumenau — imagem do projeto\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--bow-green)\">Projeto 02<\u002Fspan>\n          <h2 style=\"margin:14px 0 12px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,2.8vw,2.4rem);letter-spacing:-.03em;text-transform:uppercase\">IOA Blumenau<\u002Fh2>\n          <p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--text-secondary)\">Estratégia.<br>Social Media.<br>Campanhas.<br>Conteúdo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div data-parallax-soft=\"1\" style=\"position:relative;aspect-ratio:16/11;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)\">\n          <image-slot id=\"bow-p3\" shape=\"rect\" placeholder=\"Identidade Visual — imagem do projeto\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--bow-green)\">Projeto 03<\u002Fspan>\n          <h2 style=\"margin:14px 0 12px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,2.8vw,2.4rem);letter-spacing:-.03em;text-transform:uppercase\">Identidade Visual<\u002Fh2>\n          <p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--text-secondary)\">Branding.<br>Estratégia.<br>Direção visual.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:24px\">\n        <div data-parallax-soft=\"1\" style=\"position:relative;aspect-ratio:16/11;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)\">\n          <image-slot id=\"bow-p4\" shape=\"rect\" placeholder=\"Experiência Digital — imagem do projeto\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--bow-green)\">Projeto 04<\u002Fspan>\n          <h2 style=\"margin:14px 0 12px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,2.8vw,2.4rem);letter-spacing:-.03em;text-transform:uppercase\">Experiência Digital<\u002Fh2>\n          <p style=\"margin:0;font-size:var(--text-body);line-height:1.9;color:var(--text-secondary)\">UX/UI.<br>Website.<br>Desenvolvimento.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasOpenSlots }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"max-width:1440px;margin:clamp(36px,4vw,64px) auto 0\">\n      <p data-fade=\"1\" style=\"margin:0 0 20px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)\">Espaços para novos projetos<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(18px,2vw,28px)\">\n        <sc-for list=\"{{ openSlots }}\" as=\"slot\" hint-placeholder-count=\"3\">\n          <div data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:var(--radius-md);overflow:hidden;border:1px dashed var(--border-strong)\">\n              <image-slot id=\"{{ slot.id }}\" shape=\"rect\" placeholder=\"Novo projeto\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:var(--text-body-sm);color:var(--text-muted)\">{{ slot.label }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(80px,10vw,150px) clamp(16px,5vw,64px);background:var(--bow-black-soft);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1000px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:24px\">\n      <h2 data-split=\"1\" style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5.4vw,4.4rem);line-height:.96;letter-spacing:-.04em;text-transform:uppercase\">Sua marca pode ser muito mais.<\u002Fh2>\n      <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:54ch\">Talvez o que esteja faltando não seja mais uma ação. Talvez seja uma nova forma de pensar sua presença digital.<\u002Fp>\n      <a data-fade=\"1\" href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;padding:18px 34px;border-radius:var(--radius-pill);background:var(--accent-gradient);color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:filter .18s,transform .18s\" style-hover=\"filter:brightness(1.12)\" style-active=\"transform:scale(.97)\">Começar um projeto<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ======================= SOBRE ======================= -->\n<sc-if value=\"{{ isSobre }}\" hint-placeholder-val=\"{{ false }}\">\n<main>\n\n  <section style=\"padding:clamp(90px,14vh,170px) clamp(16px,5vw,64px) clamp(50px,6vw,90px)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(32px,5vw,80px);align-items:center\">\n      <div>\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:20px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">09 — Sobre<\u002Fspan>\n        <h1 data-split=\"1\" style=\"margin:0 0 28px;font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,7.4vw,6.8rem);line-height:.9;letter-spacing:-.045em;text-transform:uppercase\">Somos a Bow.<\u002Fh1>\n        <p data-fade=\"1\" style=\"margin:0 0 20px;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:52ch\">Uma agência para quem acredita que comunicação não precisa ser igual a todo mundo.<\u002Fp>\n        <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:52ch\">Somos estrategistas, designers, criativos e desenvolvedores trabalhando juntos para transformar negócios através do digital.<\u002Fp>\n      <\u002Fdiv>\n      <div data-parallax-soft=\"1\" style=\"position:relative;aspect-ratio:4/5;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-subtle)\">\n        <image-slot id=\"bow-sobre\" shape=\"rect\" placeholder=\"Time / estúdio Bow\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(60px,8vw,120px) clamp(16px,5vw,64px);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(32px,5vw,80px)\">\n      <div data-fade=\"1\">\n        <p style=\"margin:0 0 24px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.8rem);line-height:1.05;letter-spacing:-.03em;text-transform:uppercase\">Não seguimos fórmulas prontas.<\u002Fp>\n        <p style=\"margin:0;font-family:var(--font-display);font-weight:600;font-size:var(--text-body-lg);line-height:2.1;color:var(--bow-gray-100)\">Observamos.<br>Pensamos.<br>Criamos.<br>Testamos.<br>Construímos.<\u002Fp>\n      <\u002Fdiv>\n      <div data-fade=\"1\" style=\"display:flex;flex-direction:column;justify-content:center;gap:16px;padding-left:clamp(0px,2vw,32px);border-left:1px solid var(--border-subtle)\">\n        <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:46ch\">Porque cada negócio tem uma história diferente.<\u002Fp>\n        <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:46ch\">E cada marca merece uma forma própria de contá-la.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(80px,10vw,160px) clamp(16px,5vw,64px);background:var(--bow-black-soft);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div style=\"max-width:28ch;margin-bottom:clamp(36px,4vw,60px)\">\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:18px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">03 — Manifesto<\u002Fspan>\n        <h2 data-split=\"1\" style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5.4vw,4.6rem);line-height:.96;letter-spacing:-.04em;text-transform:uppercase\">Ideia boa precisa de direção.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:clamp(16px,2vw,26px);margin-bottom:clamp(36px,4vw,60px)\">\n        <p data-fade=\"1\" style=\"margin:0;padding:clamp(22px,2.6vw,32px);border-radius:var(--radius-md);background:var(--bow-black);border:1px solid var(--border-subtle);font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.45\">Antes do post, existe uma <span style=\"color:var(--bow-green)\">estratégia<\u002Fspan>.<\u002Fp>\n        <p data-fade=\"1\" style=\"margin:0;padding:clamp(22px,2.6vw,32px);border-radius:var(--radius-md);background:var(--bow-black);border:1px solid var(--border-subtle);font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.45\">Antes do site, existe uma <span style=\"color:var(--bow-green)\">experiência<\u002Fspan>.<\u002Fp>\n        <p data-fade=\"1\" style=\"margin:0;padding:clamp(22px,2.6vw,32px);border-radius:var(--radius-md);background:var(--bow-black);border:1px solid var(--border-subtle);font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.45\">Antes da campanha, existe um <span style=\"color:var(--bow-green)\">objetivo<\u002Fspan>.<\u002Fp>\n        <p data-fade=\"1\" style=\"margin:0;padding:clamp(22px,2.6vw,32px);border-radius:var(--radius-md);background:var(--bow-black);border:1px solid var(--border-subtle);font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.45\">Antes da tecnologia, existe um <span style=\"color:var(--bow-green)\">problema para resolver<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(24px,4vw,72px);align-items:end\">\n        <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">Não acreditamos em criar por criar. Na Bow, transformamos estratégia em criação e criação em algo que realmente funciona.<\u002Fp>\n        <p data-split=\"1\" style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.4rem,2.8vw,2.4rem);line-height:1.15;letter-spacing:-.03em;text-transform:uppercase\">Porque estética chama atenção. Mas é a estratégia que dá sentido.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(80px,10vw,160px) clamp(16px,5vw,64px);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div style=\"max-width:60ch;margin-bottom:clamp(40px,5vw,68px)\">\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:18px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">05 — Diferencial<\u002Fspan>\n        <h2 data-split=\"1\" style=\"margin:0 0 22px;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5.4vw,4.6rem);line-height:.96;letter-spacing:-.04em;text-transform:uppercase\">Não somos uma fábrica de posts.<\u002Fh2>\n        <p data-fade=\"1\" style=\"margin:0 0 16px;font-family:var(--font-display);font-weight:700;font-size:var(--text-h3)\">Somos uma agência que pensa no todo.<\u002Fp>\n        <p data-fade=\"1\" style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary)\">Enquanto algumas empresas procuram alguém para cuidar apenas do Instagram, nós olhamos para a marca, a comunicação, a experiência e a tecnologia como partes do mesmo negócio.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <div data-fade=\"1\" style=\"padding:clamp(22px,3vw,36px) 0;border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px clamp(20px,4vw,64px);align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.5;color:var(--text-muted)\">Você não precisa de mais uma postagem.<\u002Fp>\n          <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.35;letter-spacing:-.02em\">Precisa de uma comunicação que tenha propósito.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"1\" style=\"padding:clamp(22px,3vw,36px) 0;border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px clamp(20px,4vw,64px);align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.5;color:var(--text-muted)\">Você não precisa apenas de um site bonito.<\u002Fp>\n          <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.35;letter-spacing:-.02em\">Precisa de uma experiência que represente sua empresa.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"1\" style=\"padding:clamp(22px,3vw,36px) 0;border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px clamp(20px,4vw,64px);align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.5;color:var(--text-muted)\">Você não precisa de uma identidade visual qualquer.<\u002Fp>\n          <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.35;letter-spacing:-.02em\">Precisa de uma marca que tenha personalidade.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"1\" style=\"padding:clamp(22px,3vw,36px) 0;border-top:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px clamp(20px,4vw,64px);align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.5;color:var(--text-muted)\">Você não precisa estar em todos os lugares.<\u002Fp>\n          <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.35;letter-spacing:-.02em\">Precisa estar nos lugares certos.<\u002Fp>\n        <\u002Fdiv>\n        <div data-fade=\"1\" style=\"padding:clamp(22px,3vw,36px) 0;border-top:1px solid var(--border-subtle);border-bottom:1px solid var(--border-subtle);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px clamp(20px,4vw,64px);align-items:baseline\">\n          <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.5;color:var(--text-muted)\">Você não precisa de mais uma ferramenta.<\u002Fp>\n          <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);line-height:1.35;letter-spacing:-.02em\">Precisa de tecnologia que resolva problemas reais.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p data-split=\"1\" style=\"margin:clamp(30px,3.4vw,48px) 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.8rem);letter-spacing:-.03em;text-transform:uppercase;color:var(--bow-green)\">É aí que a Bow entra.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:clamp(80px,10vw,160px) clamp(16px,5vw,64px);background:var(--bow-black-soft);border-top:1px solid var(--border-subtle)\">\n    <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(32px,5vw,80px)\">\n      <div>\n        <span data-fade=\"1\" style=\"display:block;margin-bottom:18px;font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--bow-green)\">10 — Filosofia<\u002Fspan>\n        <h2 data-split=\"1\" style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,5.8vw,5rem);line-height:.92;letter-spacing:-.045em;text-transform:uppercase\">Menos fórmula. Mais intenção.<\u002Fh2>\n      <\u002Fdiv>\n      <div data-fade=\"1\" style=\"display:flex;flex-direction:column;gap:20px\">\n        <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:52ch\">Não queremos criar mais uma marca parecida com todas as outras. Não queremos preencher calendário por preencher. Não queremos desenvolver tecnologia só porque podemos.<\u002Fp>\n        <p style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.25;letter-spacing:-.03em;text-transform:uppercase\">Queremos entender o problema.<br>Encontrar a ideia.<br>Construir a solução.<\u002Fp>\n        <p style=\"margin:0;font-size:var(--text-body-lg);line-height:1.7;color:var(--text-secondary);max-width:52ch\">E fazer tudo isso com estética, estratégia e propósito.<\u002Fp>\n        <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;margin-top:8px;display:inline-flex;padding:18px 34px;border-radius:var(--radius-pill);background:var(--accent-gradient);color:#fff;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:filter .18s,transform .18s\" style-hover=\"filter:brightness(1.12)\" style-active=\"transform:scale(.97)\">Falar com a Bow<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"position:relative;padding:clamp(60px,7vw,110px) clamp(16px,5vw,64px) 32px;border-top:1px solid var(--border-subtle);background:var(--bow-black);overflow:hidden\">\n  <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:clamp(32px,4vw,72px)\">\n    <div style=\"display:flex;flex-direction:column;gap:20px\">\n      <img src=\"916f0778-6e41-43c1-90a1-15b7e5454d1e\" alt=\"bow.\" style=\"height:30px;width:auto;align-self:flex-start\">\n      <p style=\"margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--text-body);line-height:1.9;letter-spacing:.06em;text-transform:uppercase\">Estratégia.<br>Criatividade.<br>Tecnologia.<\u002Fp>\n      <p style=\"margin:0;font-size:var(--text-body-sm);line-height:1.7;color:var(--text-secondary);max-width:32ch\">Para marcas que querem ir além do óbvio.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <p style=\"margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)\">Soluções<\u002Fp>\n      <button sc-camel-on-click=\"{{ goSolucoes }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:var(--text-body-sm);color:var(--bow-gray-100);transition:color .2s\" style-hover=\"color:var(--bow-green)\">Social Media<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSolucoes }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:var(--text-body-sm);color:var(--bow-gray-100);transition:color .2s\" style-hover=\"color:var(--bow-green)\">Identidade Visual<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSolucoes }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:var(--text-body-sm);color:var(--bow-gray-100);transition:color .2s\" style-hover=\"color:var(--bow-green)\">Sites<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSolucoes }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:var(--text-body-sm);color:var(--bow-gray-100);transition:color .2s\" style-hover=\"color:var(--bow-green)\">SaaS<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSolucoes }}\" style=\"align-self:flex-start;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-body);font-size:var(--text-body-sm);color:var(--bow-gray-100);transition:color .2s\" style-hover=\"color:var(--bow-green)\">Marketing<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <p style=\"margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted)\">Contato<\u002Fp>\n      <a href=\"https://instagram.com/agencia.bow\" target=\"_blank\" rel=\"noopener\" style=\"font-size:var(--text-body-sm);color:var(--bow-gray-100)\" style-hover=\"color:var(--bow-green)\">Instagram — @agencia.bow<\u002Fa>\n      <a href=\"{{ waHref }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:var(--text-body-sm);color:var(--bow-gray-100)\" style-hover=\"color:var(--bow-green)\">WhatsApp — 51 98937-3400<\u002Fa>\n      <a href=\"mailto:bowagencydesign@gmail.com\" style=\"font-size:var(--text-body-sm);color:var(--bow-gray-100)\" style-hover=\"color:var(--bow-green)\">E-mail — bowagencydesign@gmail.com<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1440px;margin:clamp(40px,5vw,72px) auto 0;padding-top:24px;border-top:1px solid var(--border-subtle);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px\">\n    <p style=\"margin:0;font-size:var(--text-caption);color:var(--text-muted)\">© 2026 Bow Agência. Todos os direitos reservados.<\u002Fp>\n    <a href=\"#privacidade\" style=\"font-size:var(--text-caption);color:var(--text-muted)\" style-hover=\"color:var(--bow-green)\">Política de Privacidade.<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Movimento&quot;},&quot;casesEmptySlots&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:0,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cases&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: \"home\", sent: false, svc: 0 };\n\n  rootRef = (el) => { this.root = el; };\n\n  go = (page) => {\n    this.setState({ page, svc: 0 }, () => window.scrollTo({ top: 0, behavior: \"auto\" }));\n  };\n\n  wa(msg) { return \"https://wa.me/5551989373400?text=\" + encodeURIComponent(msg); }\n\n  splitWords(el) {\n    if (el.dataset.splitDone) return;\n    el.dataset.splitDone = \"1\";\n    const walk = (node) => {\n      Array.from(node.childNodes).forEach((child) => {\n        if (child.nodeType === 3) {\n          const words = child.textContent.split(/(\\s+)/).filter((w) => w.length);\n          if (!words.length) return;\n          const frag = document.createDocumentFragment();\n          words.forEach((w) => {\n            if (/^\\s+$/.test(w)) { frag.appendChild(document.createTextNode(\" \")); return; }\n            const s = document.createElement(\"span\");\n            s.className = \"w\";\n            s.textContent = w;\n            const cs = getComputedStyle(node);\n            if (cs.webkitBackgroundClip === \"text\" || cs.backgroundClip === \"text\") {\n              s.style.backgroundImage = cs.backgroundImage;\n              s.style.webkitBackgroundClip = \"text\";\n              s.style.backgroundClip = \"text\";\n              s.style.color = \"transparent\";\n            }\n            frag.appendChild(s);\n          });\n          node.replaceChild(frag, child);\n        } else if (child.nodeType === 1 && child.tagName !== \"BR\") {\n          walk(child);\n        }\n      });\n    };\n    walk(el);\n  }\n\n  async waitFor(test, tries) {\n    for (let i = 0; i < (tries || 100); i++) {\n      if (test()) return true;\n      await new Promise((r) => setTimeout(r, 70));\n    }\n    return false;\n  }\n\n  async initAnim() {\n    const ok = await this.waitFor(() => window.gsap && window.ScrollTrigger);\n    if (!ok || !this.root) return;\n    const { gsap, ScrollTrigger } = window;\n    gsap.registerPlugin(ScrollTrigger);\n    const on = this.props.animations !== false;\n\n    if (this._ctx) this._ctx.revert();\n    if (this._marquee) { this._marquee.kill(); this._marquee = null; }\n\n    this._ctx = gsap.context((self) => {\n      const q = (sel) => Array.from(this.root.querySelectorAll(sel));\n      const inView = (el) => el.getBoundingClientRect().top < window.innerHeight * 0.92;\n\n      q(\"[data-split]\").forEach((el) => {\n        this.splitWords(el);\n        const words = el.querySelectorAll(\".w\");\n        if (!on) { gsap.set(words, { opacity: 1, yPercent: 0 }); return; }\n        const vars = { yPercent: 108, opacity: 0, duration: 0.9, ease: \"power3.out\", stagger: 0.028 };\n        if (inView(el)) gsap.from(words, { ...vars, delay: 0.08 });\n        else gsap.from(words, { ...vars, scrollTrigger: { trigger: el, start: \"top 92%\", once: true } });\n      });\n\n      q(\"[data-fade]\").forEach((el) => {\n        if (!on) return;\n        const vars = { y: 34, opacity: 0, duration: 0.85, ease: \"power2.out\" };\n        if (inView(el)) gsap.from(el, { ...vars, delay: 0.14 });\n        else gsap.from(el, { ...vars, scrollTrigger: { trigger: el, start: \"top 94%\", once: true } });\n      });\n\n      q(\"[data-parallax]\").forEach((el) => {\n        if (!on) return;\n        gsap.fromTo(el, { yPercent: -6 }, {\n          yPercent: 6, ease: \"none\",\n          scrollTrigger: { trigger: el.parentElement, start: \"top bottom\", end: \"bottom top\", scrub: true },\n        });\n      });\n\n      q(\"[data-parallax-soft]\").forEach((el) => {\n        if (!on) return;\n        gsap.fromTo(el, { y: 26 }, {\n          y: -26, ease: \"none\",\n          scrollTrigger: { trigger: el, start: \"top bottom\", end: \"bottom top\", scrub: true },\n        });\n      });\n\n      q(\"[data-hscroll]\").forEach((sec) => {\n        const track = sec.querySelector(\"[data-htrack]\");\n        if (!track || !on || window.innerWidth < 760) return;\n        const dist = () => Math.max(0, track.scrollWidth - sec.clientWidth + 64);\n        gsap.to(track, {\n          x: () => -dist(), ease: \"none\",\n          scrollTrigger: {\n            trigger: sec, start: \"top top\", end: () => \"+=\" + (dist() + 400),\n            pin: true, scrub: 0.6, invalidateOnRefresh: true, anticipatePin: 1,\n          },\n        });\n      });\n\n      const mtrack = this.root.querySelector(\"[data-mtrack]\");\n      if (mtrack && on) {\n        const half = mtrack.scrollWidth / 2;\n        gsap.set(mtrack, { x: 0 });\n        this._marquee = gsap.to(mtrack, {\n          x: -half, duration: 22, ease: \"none\", repeat: -1,\n          modifiers: { x: (v) => (parseFloat(v) % half) + \"px\" },\n        });\n      }\n    }, this.root);\n\n    requestAnimationFrame(() => ScrollTrigger.refresh());\n\n    clearTimeout(this._safety);\n    this._safety = setTimeout(() => {\n      if (!this.root) return;\n      ScrollTrigger.refresh();\n      this.root.querySelectorAll(\".w, [data-fade]\").forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top < window.innerHeight && parseFloat(getComputedStyle(el).opacity) < 0.05) {\n          gsap.set(el, { opacity: 1, y: 0, yPercent: 0 });\n        }\n      });\n    }, 1600);\n  }\n\n  componentDidMount() { this.initAnim(); }\n  componentDidUpdate(prev) {\n    if (prev.page !== this.state.page || prev.animations !== this.props.animations) this.initAnim();\n  }\n  componentWillUnmount() {\n    if (this._ctx) this._ctx.revert();\n    if (this._marquee) this._marquee.kill();\n  }\n\n  renderVals() {\n    const page = this.state.page;\n    const active = \"var(--bow-white)\";\n    const idle = \"var(--bow-gray-500)\";\n    const n = Math.max(0, Math.min(4, this.props.casesEmptySlots ?? 3));\n    const openSlots = Array.from({ length: n }, (_, i) => ({\n      id: \"bow-open-\" + (i + 1), label: \"Projeto \" + String(i + 5).padStart(2, \"0\"),\n    }));\n    const svc = this.state.svc;\n    const setSvc = (i) => () => this.setState({ svc: i });\n    return {\n      rootRef: this.rootRef,\n      isHome: page === \"home\", isSolucoes: page === \"solucoes\", isCases: page === \"cases\", isSobre: page === \"sobre\",\n      cHome: page === \"home\" ? active : idle,\n      cSolucoes: page === \"solucoes\" ? active : idle,\n      cCases: page === \"cases\" ? active : idle,\n      cSobre: page === \"sobre\" ? active : idle,\n      goHome: () => this.go(\"home\"), goSolucoes: () => this.go(\"solucoes\"),\n      goCases: () => this.go(\"cases\"), goSobre: () => this.go(\"sobre\"),\n      oSvc: svc ? 1 : 0,\n      tSvc: svc ? \"scale(1) translateY(0)\" : \"scale(.94) translateY(16px)\",\n      hSvc1: setSvc(1), hSvc2: setSvc(2), hSvc3: setSvc(3), hSvc4: setSvc(4), hSvc5: setSvc(5),\n      hSvcOut: setSvc(0),\n      waHref: this.wa(\"Olá! Vim pelo site da Bow e quero falar sobre um projeto.\"),\n      waSocial: this.wa(\"Olá! Quero saber mais sobre Social Media com a Bow.\"),\n      waIdentidade: this.wa(\"Olá! Quero saber mais sobre Identidade Visual com a Bow.\"),\n      waSites: this.wa(\"Olá! Quero saber mais sobre criação de sites com a Bow.\"),\n      waTech: this.wa(\"Olá! Quero criar uma solução em SaaS/tecnologia com a Bow.\"),\n      waMarketing: this.wa(\"Olá! Quero saber mais sobre Marketing com a Bow.\"),\n      openSlots, hasOpenSlots: openSlots.length > 0,\n      submitLabel: this.state.sent ? \"Projeto enviado ✓\" : \"Enviar projeto\",\n      onSubmit: (e) => { e.preventDefault(); this.setState({ sent: true }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
